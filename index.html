    <style>
        /* CSS Variables for easier theme management */
        :root {
            --primary-color: #C6BFB4;
            --background-card-color: #c6bfb471;
            --text-color-light: #E9E3D9;
            --text-shadow-light: 0 0 6px var(--text-color-light), 0 0 18px var(--text-color-light);
            --shadow-dark: rgba(0, 0, 0, 0.3);
            --shadow-light: rgba(255, 255, 255, 0.5);
            --blur-strength: 15px;
        }

        /* Basic Reset & Selection */
        ::selection {
            background: var(--primary-color);
            color: #C6BFB4;
        }

        /* Set default cursor with fallback */
        * {
            cursor: url(cursor.png) 16 16, auto !important; /* Specify hotspot for custom cursor */
            box-sizing: border-box; /* Include padding and border in the element's total width and height */
        }

        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            overflow: auto; /* Allow scrolling on small screens */
            -webkit-overflow-scrolling: touch;
        }

        /* Clock Hint Overlay for Autoplay Compliance */
        .clock-hint {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 16px;
            border-radius: 8px;
            z-index: 100; /* Ensure it's above other content */
            /* Start hidden, JavaScript will control display and opacity */
            display: none;
            opacity: 0;
            transition: opacity 0.6s ease-out; /* Smooth fade-out */
        }

        /* Background & Overlay */
        .background {
            position: fixed;
            width: 100%;
            height: 100%;
            background: url("background.jpg") no-repeat center center / cover;
            filter: blur(7px);
            z-index: -2; /* Layer below content */
        }

        .overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: -1; /* Layer between background and content */
        }

        /* Content Area */
        .content {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px; /* Add some padding for smaller screens */
        }

        /* Profile Card */
        .card {
            width: 100%;
            max-width: 610px;
            padding: 25px;
            background-color: var(--background-card-color);
            backdrop-filter: blur(var(--blur-strength));
            border-radius: 22px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
            margin-bottom: 20px;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #e9dcc2;
            overflow: hidden;
            margin: 0 auto 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block; /* Ensures no extra space below the image */
        }

        /* Tooltip box that appears to the left of the profile picture on hover/focus */
        .profile-wrapper {
            position: relative;
            display: inline-block;
        }

        .profile-pic {
            position: relative;
            transition: transform 0.22s ease;
        }

        .profile-pic:hover,
        .profile-pic:focus {
            transform: scale(1.06);
        }

        .tooltip-box {
            position: absolute;
            right: 130%;
            top: 50%;
            transform: translateY(-50%) translateX(10px);
            background: rgba(0,0,0,0.78);
            color: #fff;
            padding: 12px 14px;
            border-radius: 10px;
            width: 240px;
            font-size: 0.92rem;
            line-height: 1.25;
            text-align: left;
            box-shadow: 0 8px 20px rgba(0,0,0,0.45);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
            z-index: 50;
            white-space: normal;
            word-wrap: break-word;
        }

        /* Show when JS toggles aria-hidden */
        .tooltip-box[aria-hidden="false"] {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
            pointer-events: auto;
        }

        .profile-pic:hover ~ .tooltip-box,
        .profile-pic:focus ~ .tooltip-box {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
            pointer-events: auto;
        }

        .tooltip-box::after {
            content: "";
            position: absolute;
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-left: 8px solid rgba(0,0,0,0.78);
        }

        .card h1 { /* Changed from h2 to h1 for semantic correctness and better SEO */
            font-family: 'Miss Fajardose', cursive;
            font-size: 2.7rem;
            font-weight: normal;
            letter-spacing: 2px;
            color: var(--text-color-light);
            text-shadow: var(--text-shadow-light);
            margin: 0 0 12px 0; /* Adjusted margin for h1 */
        }

        .card p {
            color: var(--text-color-light);
            text-shadow: var(--text-shadow-light);
            margin-bottom: 12px;
            font-weight: bold;
            font-size: 1rem;
        }

        .location {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: 0.85rem;
            color: var(--text-color-light);
            text-shadow: var(--text-shadow-light);
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-weight: 200;
        }

        /* Social Icons */
        .social-icons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; /* Allows icons to wrap on smaller screens */
            gap: 16px;
            font-size: 1.8rem;
            margin-top: 10px;
        }

        .social-icons a {
            color: var(--text-color-light);
            transition: transform 0.3s ease, color 0.3s ease, filter 0.3s ease;
            filter: drop-shadow(0 0 5px var(--text-color-light));
            text-decoration: none; /* Remove underline from links */
            display: inline-flex; /* Ensure icon is treated as a block for consistent spacing/transform */
            align-items: center;
            justify-content: center;
        }

        .social-icons a:hover {
            transform: scale(1.2);
            color: var(--primary-color);
            filter: drop-shadow(0 0 5px var(--primary-color));
        }

        /* Mini Player */
        .mini-player {
            width: 100%;
            max-width: 610px;
            padding: 14px 20px;
            background: var(--background-card-color);
            backdrop-filter: blur(var(--blur-strength));
            border-radius: 18px;
            box-shadow: 0 0 25px var(--shadow-dark);
            font-family: 'Satoshi', sans-serif;
            color: var(--text-color-light);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .player-content {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%; /* Ensure it takes full width of player */
        }

        .cover-image {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 8px var(--shadow-dark);
            flex-shrink: 0; /* Prevent image from shrinking */
        }

        .info-controls {
            flex: 1; /* Allows this div to take remaining space */
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .info-controls p {
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-color-light);
            text-shadow: var(--text-shadow-light);
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; /* Adds "..." for long titles */
        }

        /* Marquee animation for overflowing track title on small screens */
        .title-text {
            display: inline-block;
            will-change: transform;
        }

        .title-text.marquee {
            animation-name: scroll-left;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes scroll-left {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-100%); }
        }

        /* Timeline (range input) styling for cross-browser consistency */
        #timeline {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            outline: none;
            -webkit-appearance: none; /* For Chrome/Safari */
            -moz-appearance: none;    /* For Firefox */
            appearance: none;         /* Standard */
            cursor: pointer;
            margin: 5px 0;
        }

        /* Custom thumb styles */
        #timeline::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: grab;
            box-shadow: 0 0 5px var(--primary-color);
            transition: background 0.3s ease;
        }

        #timeline::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: grab;
            box-shadow: 0 0 5px var(--primary-color);
            transition: background 0.3s ease;
        }

        /* For IE/Edge Legacy */
        #timeline::-ms-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: grab;
            box-shadow: 0 0 5px var(--primary-color);
            transition: background 0.3s ease;
        }

        .bottom-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .time-display { /* Removed 'small' as a class, applied to container */
            font-size: 0.8rem;
            color: #ccc;
            white-space: nowrap;
        }

        .controls {
            display: flex;
            gap: 5px;
        }

        .controls button {
            background-color: transparent;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text-color-light);
            transition: background-color 0.3s ease, box-shadow 0.3s ease, color 0.3s ease;
        }

        .controls button:hover {
            background-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 10px var(--shadow-light);
            color: var(--primary-color);
        }

        .controls button i {
            pointer-events: none; /* Ensures click goes to the button, not the icon */
            filter: drop-shadow(0 0 5px var(--text-color-light));
            transition: filter 0.3s ease;
        }

        .controls button:hover i {
             filter: drop-shadow(0 0 5px var(--primary-color));
        }

        .backward, .forward {
            color: rgba(255, 255, 255, 0.7); /* Slightly muted for non-play buttons */
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .card, .mini-player {
                width: 95%; /* Use percentage for better flexibility */
                padding: 20px;
            }

            .card h1 {
                font-size: 2.2rem;
            }

            .profile-pic {
                width: 100px;
                height: 100px;
            }

            .social-icons {
                font-size: 1.5rem;
                gap: 12px;
            }

            .mini-player {
                flex-direction: column; /* Stack elements vertically */
                align-items: center;
                text-align: center;
            }

            .player-content {
                flex-direction: column;
                gap: 10px;
                width: 100%;
            }

            .cover-image {
                margin-right: 0;
                margin-bottom: 10px;
            }

            .info-controls {
                align-items: center; /* Center content when stacked */
            }

            .bottom-line {
                flex-direction: column;
                gap: 10px;
            }

            .controls {
                margin-top: 10px;
            }
        }

        @media (max-width: 480px) {
            .card, .mini-player {
                padding: 15px;
            }

            .card h1 {
                font-size: 1.8rem;
            }

            .profile-pic {
                width: 80px;
                height: 80px;
            }

            /* On small screens place tooltip under the profile picture and center it */
            .tooltip-box {
                right: auto;
                left: 50%;
                top: 120%;
                transform: translateX(-50%) translateY(8px);
                width: calc(100% - 40px);
                max-width: 300px;
                font-size: 0.9rem;
            }

            .profile-pic:hover ~ .tooltip-box,
            .profile-pic:focus ~ .tooltip-box {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }

            .social-icons {
                font-size: 1.3rem;
                gap: 10px;
            }

            .cover-image {
                width: 60px;
                height: 60px;
            }

            .info-controls p {
                font-size: 0.9rem;
            }

            .time-display {
                font-size: 0.75rem;
            }

            .controls button {
                padding: 6px 10px;
                font-size: 0.9rem;
            }
        }
    </style>

    <script>
        // Self-executing anonymous function (IIFE) to prevent global variable pollution
        (function() {
            const arabicTracks = [
                {
                    title: "تعتذر لي الحين ولا انسى حب الماضي كله",
                    file: "audio/Tatazarr_Li_AlHeen.mp3",
                    cover: "ARcovers/cover1.jpg"
                },
                {
                    title: "غُصن رمان",
                    file: "audio/Ghusn_Rumman.mp3",
                    cover: "ARcovers/cover2.jpg"
                },
                {
                    title: "خالتك مو زينة",
                    file: "audio/Khaltik_Mo_Zeina.mp3",
                    cover: "ARcovers/cover3.jpg"
                }
            ];

            const foreignTracks = [
                {
                    title: "Harpy Hare",
                    file: "audio/Harpy_Hare.mp3",
                    cover: "EUcovers/cover1.jpg"
                },
                {
                    title: "Hartebeest",
                    file: "audio/Hartebeest.mp3",
                    cover: "EUcovers/cover2.jpg"
                },
                {
                    title: "And The Hound",
                    file: "audio/And_The_Hound.mp3",
                    cover: "EUcovers/cover3.jpg"
                }
            ];

            const gulfCountries = new Set(["SA", "AE", "KW", "QA", "BH", "OM", "YE"]);
            let tracks = [];
            let currentTrackIndex = 0;
            let userInteracted = false;

            const audioPlayer = document.getElementById("audioPlayer");
            const trackTitleEl = document.getElementById("trackTitle");
            const coverImageEl = document.getElementById("coverImage");
            const timeline = document.getElementById("timeline");
            const currentTimeEl = document.getElementById("current");
            const durationEl = document.getElementById("duration");
            const playButton = document.querySelector(".play");
            const playIcon = playButton.querySelector("i");
            const backwardButton = document.querySelector(".backward");
            const forwardButton = document.querySelector(".forward");
            const clockOverlay = document.getElementById("clockOverlay");

            function isGulfCountry(code) {
                return gulfCountries.has(code);
            }

            function selectTracksByGeo(geo) {
                if (!geo || !geo.continent_code) {
                    return arabicTracks;
                }

                if (geo.continent_code === "EU") {
                    return foreignTracks;
                }

                if (geo.continent_code === "AS" && isGulfCountry(geo.country_code)) {
                    return arabicTracks;
                }

                return foreignTracks;
            }

            async function fetchGeoAndSelectTracks() {
                trackTitleEl.textContent = "Selecting tracks based on your location...";
                try {
                    const response = await fetch("https://ipapi.co/json/");
                    if (!response.ok) {
                        throw new Error(`Geo lookup failed: ${response.status}`);
                    }

                    const geo = await response.json();
                    tracks = selectTracksByGeo(geo);
                } catch (error) {
                    console.warn("Geo lookup failed, using default Arabic tracks:", error);
                    tracks = arabicTracks;
                }
            }

            function formatTime(seconds) {
                if (isNaN(seconds) || seconds < 0) return "0:00";
                const minutes = Math.floor(seconds / 60);
                const remainingSeconds = Math.floor(seconds % 60);
                return `${minutes}:${remainingSeconds < 10 ? "0" : ""}${remainingSeconds}`;
            }

            function setTrack(index) {
                const track = tracks[index];
                if (!track) {
                    trackTitleEl.textContent = "No tracks available";
                    coverImageEl.src = "";
                    audioPlayer.src = "";
                    return;
                }

                trackTitleEl.textContent = track.title;
                coverImageEl.src = track.cover;
                audioPlayer.src = track.file;
                audioPlayer.load();
            }

            function playTrack(index) {
                if (!tracks.length) return;
                currentTrackIndex = (index + tracks.length) % tracks.length;
                setTrack(currentTrackIndex);

                if (!userInteracted) {
                    playIcon.className = "fas fa-play";
                    return;
                }

                audioPlayer.play().then(() => {
                    playIcon.className = "fas fa-pause";
                }).catch(error => {
                    console.warn("Playback prevented:", error.name, error.message);
                    playIcon.className = "fas fa-play";
                });
            }

            function togglePlay() {
                userInteracted = true;
                hideOverlay();

                if (audioPlayer.paused) {
                    audioPlayer.play().then(() => {
                        playIcon.className = "fas fa-pause";
                    }).catch(error => {
                        console.warn("Playback prevented (manual play attempt):", error.name, error.message);
                        playIcon.className = "fas fa-play";
                    });
                } else {
                    audioPlayer.pause();
                    playIcon.className = "fas fa-play";
                }
            }

            function nextTrack() {
                if (!tracks.length) return;
                playTrack(currentTrackIndex + 1);
            }

            function prevTrack() {
                if (!tracks.length) return;
                playTrack(currentTrackIndex - 1);
            }

            function hideOverlay() {
                if (clockOverlay.style.display !== "block" && clockOverlay.style.opacity !== "1") {
                    return;
                }

                clockOverlay.style.opacity = '0';
                setTimeout(() => {
                    clockOverlay.style.display = "none";
                }, 600);
            }

            function initializePlayer() {
                if (!tracks.length) {
                    trackTitleEl.textContent = "No tracks available";
                    playButton.disabled = true;
                    backwardButton.disabled = true;
                    forwardButton.disabled = true;
                    timeline.disabled = true;
                    return;
                }

                currentTrackIndex = 0;
                setTrack(currentTrackIndex);
            }

            document.addEventListener("DOMContentLoaded", async () => {
                await fetchGeoAndSelectTracks();
                initializePlayer();

                clockOverlay.style.display = "block";
                clockOverlay.style.opacity = '1';
            });

            document.addEventListener("click", () => {
                if (!userInteracted) {
                    userInteracted = true;
                    playTrack(currentTrackIndex);
                    hideOverlay();
                }
            }, { once: true });

            audioPlayer.addEventListener("loadedmetadata", () => {
                timeline.max = Math.floor(audioPlayer.duration);
                durationEl.textContent = formatTime(audioPlayer.duration);
                if (audioPlayer.paused) {
                    timeline.value = 0;
                    currentTimeEl.textContent = "0:00";
                }
            });

            audioPlayer.addEventListener("timeupdate", () => {
                if (!timeline.dataset.dragging) {
                    timeline.value = Math.floor(audioPlayer.currentTime);
                    currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
                }
            });

            timeline.addEventListener("input", () => {
                audioPlayer.currentTime = timeline.value;
                currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
            });

            playButton.addEventListener("click", togglePlay);
            backwardButton.addEventListener("click", prevTrack);
            forwardButton.addEventListener("click", nextTrack);

            audioPlayer.addEventListener("ended", nextTrack);

            timeline.addEventListener("mousedown", () => {
                timeline.dataset.dragging = "true";
            });
            timeline.addEventListener("mouseup", () => {
                delete timeline.dataset.dragging;
            });
            timeline.addEventListener("touchstart", () => {
                timeline.dataset.dragging = "true";
            });
            timeline.addEventListener("touchend", () => {
                delete timeline.dataset.dragging;
            });
        })(); // End of IIFE
    </script>

    <script>
        (function(){
            const tooltip = document.getElementById('profileTooltip');
            const heading = document.getElementById('profile-heading');
            const profilePic = document.querySelector('.profile-pic');
            if(!tooltip || !profilePic) return;

            const username = heading ? heading.textContent.trim() : 'friend';

            const template = `Hi! <3\nMy name is Bassam, but you can call me Waffle \n16 y/o I know I’m still a kid :)\nI’m Staight & I love Sophia lillis & Ella & Sabe <3\nI don’t mind starting a streak ^_^\nInsta: sydneynovak_0 \n Snap: sydneynovak.0\nI reply anytime ._. \nI Love You So Much!!! <333`;

            const filled = template.replace(/\[username\]/g, username).replace(/\n/g, '<br>');
            tooltip.innerHTML = filled;

            // accessibility: toggle aria-hidden on hover/focus
            function show() { tooltip.setAttribute('aria-hidden', 'false'); }
            function hide() { tooltip.setAttribute('aria-hidden', 'true'); }

            profilePic.addEventListener('mouseenter', show);
            profilePic.addEventListener('mouseleave', hide);
            profilePic.addEventListener('focus', show);
            profilePic.addEventListener('blur', hide);

            // For touch devices: tap to toggle
            let tapped = false;
            profilePic.addEventListener('click', (e) => {
                if(window.matchMedia('(hover: none)').matches) {
                    tapped = !tapped;
                    tooltip.setAttribute('aria-hidden', tapped ? 'false' : 'true');
                    e.stopPropagation();
                }
            });

            // Hide tooltip when tapping elsewhere on touch devices
            document.addEventListener('click', () => { if(tapped) { tapped = false; hide(); } });
        })();
    </script>
</body>
</html>
